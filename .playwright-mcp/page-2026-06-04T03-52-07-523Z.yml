        - generic [ref=e116]:
          - heading "2. Harness：可治理的 agent operating environment" [level=2] [ref=e117]
          - paragraph [ref=e118]: 常见资料会把 Harness 描述成模型外部的基础设施：orchestration loop、tools、memory、context management、state persistence、guardrails、verification loops、sandbox、observability。这些描述有用，但更像组件清单。
          - paragraph [ref=e119]: 更适合大规模 Agent 系统的定义是：Harness 是一个可治理的 agent operating environment。它不是模型，不是 prompt 模板集合，也不是 tool calling wrapper。它提供的是一套运行环境，让模型会话、工具、工作流、人工决策、长期记忆和 UI 操作都能被同一套 Runtime 状态规则管理。
          - paragraph [ref=e120]: “可治理”意味着每个动作都有对象、权限、证据、状态和恢复位置。模型生成的内容不是事实，工具跑出的结果也不是事实；只有 Runtime 接受、记录并投影之后，它们才进入系统的操作视图。
          - figure "Harness 不是把所有外部组件堆在模型旁边，而是把这些组件放进 Runtime 可治理、可记录、可恢复、可投影的运行环境。" [ref=e121]:
            - img "Harness 作为可治理运行环境 Harness 将模型交互、执行、状态、上下文、Adapter 和 UI 放在统一治理边界中。" [ref=e122]:
