        - generic [ref=e289]:
          - heading "7. Context：不是简单 transcript 回放" [level=2] [ref=e290]
          - paragraph [ref=e291]: Context 不是把 transcript 原样回放给模型。很多 Agent 系统默认把历史消息、工具输出、失败尝试和旧计划塞回上下文。缓存可以降低成本，但不能消除语义噪声。陈旧 trace、长 stdout、被替代的 plan 和无关 child session 摘要仍然会影响模型注意力。
          - paragraph [ref=e292]: Context 应该由 Runtime 构造。Runtime 根据当前 Assignment 的目标、当前 Projection、Memory scope、Artifact refs、环境信息、约束和可见性策略，生成 Context Bundle。模型看到的是适合当前判断的输入，不是系统历史的堆叠。
          - paragraph [ref=e293]: Session Log 仍然重要，但它是持久记录，不等于下一次模型调用的输入。当前 Projection 应该优先于历史 Memory，完整输出应该以 Artifact 或 log 保存，模型默认读取摘要和引用。Context 的价值在于选择，而不是堆满。
          - figure "Context 不是 transcript 回放。Runtime 根据当前任务选择 Projection、Memory、Artifact 和 Session Log 的可见部分，构造模型输入。" [ref=e294]:
            - img "Runtime 构造 Context Bundle Projection、Memory、Artifact refs、Session Log 和 Visibility Policy 进入 Runtime，生成模型可见的 Context Bundle。" [ref=e295]:
