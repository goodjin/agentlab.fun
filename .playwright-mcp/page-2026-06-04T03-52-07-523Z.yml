        - generic [ref=e189]:
          - heading "4. 准确地说：Agent 是模板，真正执行任务的是 Session" [level=2] [ref=e190]
          - paragraph [ref=e191]: 大规模 Agent 系统里，“Agent”这个词很容易被用得太宽。准确地说，Agent 是模板：它定义 persona、entry、capability、permission profile、模型偏好和运行策略。它描述一个可复用执行角色，但不直接执行任务。
          - paragraph [ref=e192]: 真正执行任务的是 Session，也就是 Runtime 基于 Agent 模板创建出来的 Agent Session。Runtime 把 Assignment、authority、context refs、artifact refs 和 trace refs 绑定给这个 Session，让每次执行都有稳定 session id、session log、状态、权限边界和 trace。
          - paragraph [ref=e193]: 这个区分能避免两类混乱：第一，把模板配置误认为执行权限；第二，把一个长对话当成所有任务共享的上下文容器。模板可以复用，Session 应该绑定具体任务边界。
          - figure "Agent 是可复用模板，Session 才是任务执行边界。权限、上下文、日志、状态和 trace 都应该绑定在 Session 上。" [ref=e194]:
            - img "Agent 模板与 Agent Session Runtime 从 Agent 模板创建多个 Agent Session，并给每个 Session 绑定 Assignment、Authority、Session Log 和 Trace。" [ref=e195]:
