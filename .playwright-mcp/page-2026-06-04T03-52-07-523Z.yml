        - generic [ref=e257]:
          - heading "6. 系统状态治理：Event Log、Projection、Trace" [level=2] [ref=e258]
          - paragraph [ref=e259]: 系统状态治理的第一步，是不要把所有状态混成一团。聊天记录像事实，数据库行像事实，UI 当前显示也像事实，工具输出也像事实。等系统失败时，团队会发现没人知道该相信哪一个。
          - paragraph [ref=e260]: 协议需要把状态拆成不同角色。Event Log 是 Runtime 接受事实的追加式记录。Projection 是由 Event 和状态规则推导出的当前操作视图。Materialized State 是为了查询、展示、调度和恢复而保存的状态形态。Trace 是把 Event、Action、Assignment、executor invocation、Artifact、Gate、Decision 和 error 串起来的证据链。
          - paragraph [ref=e261]: Event Log 回答“系统接受了什么”。Projection 回答“现在应该怎么操作”。Trace 回答“为什么会走到这里，证据在哪里”。这三类问题都很具体，不能交给一个非结构化 transcript 来承担。
          - figure "系统状态治理要分清事实、视图和证据链。Event Log、Projection、Trace 分离后，审计、回放、调试、评测和恢复才有稳定基础。" [ref=e262]:
            - img "Event Log、Projection 与 Trace Command 通过 Runtime 验证后写入 Event Log，再推导 Projection，同时生成 Trace 证据链。" [ref=e263]:
