        - generic [ref=e351]:
          - heading "9. Workflow：协议支持直接生成 Workflow，又不止于 Workflow" [level=2] [ref=e352]
          - paragraph [ref=e353]: "协议应该支持直接生成 Workflow。多阶段、并行、多 Agent、可恢复、需要进度和审计的任务，适合由 Workflow Runner 生成 durable DAG，并通过 Runtime-owned 的 `workflow.create`、`workflow.start`、`workflow.decide` 等入口运行。"
          - paragraph [ref=e354]: 但 Harness 不止于 Workflow。Workflow 是基于 Harness 基础 DSL 的 durable orchestration adapter，用来表达一类长任务编排。短生命周期的 action graph、普通 tool action、Agent delegation、human approval、release gate、evaluation loop，也应该落在同一套 Runtime 治理模型里。
          - paragraph [ref=e355]: 这个边界很关键。Workflow 可以定义 DAG、node state、artifact、decision record 和 failure policy，但 Runtime 仍然拥有 validation、state transition、scheduling、permission、event、projection 和 gate。Workflow 描述编排状态，不应该变成绕过 Runtime 的脚本语言。
