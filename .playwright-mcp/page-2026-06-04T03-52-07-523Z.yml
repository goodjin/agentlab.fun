            - generic [ref=e318]: Context 不是 transcript 回放。Runtime 根据当前任务选择 Projection、Memory、Artifact 和 Session Log 的可见部分，构造模型输入。
        - generic [ref=e319]:
          - heading "8. Agent Session 之间不直接通信" [level=2] [ref=e320]
          - paragraph [ref=e321]: 多 Agent 的收益来自上下文隔离、并行探索、独立评估和明确交接。但多 Agent 也会带来成本、冲突和状态一致性问题。让 Agent Session 互相转发自然语言消息，看起来直接，实际会把系统带回不可审计的聊天网络。
          - paragraph [ref=e322]: 更稳的方式是：Agent Session 之间不直接通信。Agent A 可以提交结果、Artifact、风险、未决问题或下一步 Action 建议。Runtime 接受这些内容后，生成 Event、更新 Projection、创建 Handoff 或 Assignment，再把结构化 Context Bundle 交给 Agent B。
          - paragraph [ref=e323]: 这样每一次交接都有 contract、authority、evidence、budget、unresolved issues 和 trace continuity。协作不靠自由文本延续，而靠 Runtime 管理的任务边界和证据传递。
          - figure "多 Agent 协作的核心不是互相聊天，而是通过 Runtime 保留任务边界、证据和状态连续性。" [ref=e324]:
