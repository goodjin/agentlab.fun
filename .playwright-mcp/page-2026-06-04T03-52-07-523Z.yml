        - generic [ref=e382]:
          - heading "10. 人的位置：UI 治理操作面，人也是生产环境的一环" [level=2] [ref=e383]
          - paragraph [ref=e384]: 大规模 Agent 系统里，人不是站在系统外的观察者。人会批准、暂停、恢复、回答 Decision、处理异常、审查结果、设定偏好，也会承担 owner、reviewer、operator 等生产角色。人的动作同样需要进入治理链路。
          - paragraph [ref=e385]: UI 是人的治理操作面，而不是聊天记录渲染器。UI 应该读取 Projection、Event、Artifact、Trace、Memory 和 Concept。UI 中所有会改变系统状态的操作，都应该提交为 Runtime Command 或受控 Action。暂停、恢复、重试、取消、回答 Decision、重新验证，都不能只改前端状态。
          - paragraph [ref=e386]: 更进一步，UI projection、Artifact summary 和 Trace export 都应该 agent-readable。它们既给人看，也给后续 Agent Session 读。稳定 id、状态、summary、refs、evidence、actor、time 和 visibility metadata，是把“人”纳入生产环境的基础。
