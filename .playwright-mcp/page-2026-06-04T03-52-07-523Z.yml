        - generic [ref=e151]:
          - heading "3. Runtime：Agent 系统的治理中心" [level=2] [ref=e152]
          - paragraph [ref=e153]: Runtime 不应该只是把模型输出转成工具调用的胶水层。大规模 Agent 系统里，Runtime 是治理中心：它决定哪些请求可以被接受，哪些动作需要 Gate，哪些结果能进入状态，哪些失败需要恢复或升级给人。
          - paragraph [ref=e154]: 具体来说，Runtime 接受结构化 Command、Action 或 adapter operation，完成 schema 校验、权限校验、Gate 判断、Executor 选择、Assignment 创建、Event 追加、Projection 更新、Trace 维护和恢复管理。模型可以提出行动，Runtime 才能让行动发生。
          - paragraph [ref=e155]: 这个边界让系统的控制权保持清楚：模型负责判断、计划、解释和声明；Runtime 负责接受、校验、调度、记录和恢复。长任务和多主体协作能不能持续，主要取决于这条边界是否稳定。
          - figure "Runtime 是 Agent 系统的治理中心：模型声明意图，Runtime 校验和调度，执行后再生成 Event 并更新 Projection。" [ref=e156]:
            - img "Runtime 控制状态变更 模型声明意图，Runtime 归一化为 Action，经过 Gate 和 Routing，执行后生成 Event 并更新 Projection。" [ref=e157]:
