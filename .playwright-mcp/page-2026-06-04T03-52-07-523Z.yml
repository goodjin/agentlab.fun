        - generic [ref=e219]:
          - heading "5. Action 表意，用声明式替代命令式 Tool Call" [level=2] [ref=e220]
          - paragraph [ref=e221]: Tool Call 的默认语气是命令式的：调用哪个工具，传什么参数，马上执行。这个方式适合简单工具循环，但在大规模 Agent 系统里会把模型推到执行控制位上。模型一旦直接决定工具、参数、顺序和副作用，Runtime 就很难治理。
          - paragraph [ref=e222]: Action 的作用是表意。它描述“我要做什么语义工作”：读哪些资源、产生什么结果、有什么副作用、依赖什么、期望什么返回粒度、建议由哪类 Executor 处理。模型声明 Action，Runtime 再决定是否允许、如何执行、如何记录。
          - paragraph [ref=e223]: Tool Call 仍然可以作为 carrier，因为当前模型和 provider 都擅长这个机制。但它进入 Runtime 后要被归一化为 Action。这样一来，读文件、委派 review、请求用户批准、启动 workflow 都能走同一条治理链路，而不是散落成不同的命令通道。
          - figure "Action 是表意层。Tool Call 可以继续作为 carrier，但不能以命令式方式绕过 Runtime 的策略、Gate、执行和记录链路。" [ref=e224]:
            - img "Action 用声明式表达模型意图 不同 carrier 进入 Runtime 后统一归一化为 Action，Action 表达语义意图，再路由到不同 Executor。" [ref=e225]:
