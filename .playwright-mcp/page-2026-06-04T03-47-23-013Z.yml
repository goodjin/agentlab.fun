        - generic [ref=e414]:
          - heading "11. 与常见 Harness 理念的不同之处" [level=2] [ref=e415]
          - paragraph [ref=e416]: 常见 Harness 理念通常从“让模型能工作”出发：给模型工具、上下文、沙箱、记忆、评测、可观测性和工作流。这些能力都必要，但它们仍然偏向能力拼装。
          - paragraph [ref=e417]: OpenAI、Anthropic 和 Agent Harness Survey 的资料都指向一个趋势：Agent 可靠性不能只靠模型能力，模型外部的执行环境、上下文、状态、验证、可观测性和治理会显著影响结果。OpenAI 更强调 agent-first 工程组织、SDK primitives、sandbox、manifest、state externalization 和 durable execution。Anthropic 更强调 session / harness / sandbox 解耦、长任务 handoff、planner / generator / evaluator、多 Agent 成本和 trace-based eval。Survey 则把 Harness 分成 Execution、Tooling、Context、Lifecycle、Observability、Verification、Governance 等层。
          - paragraph [ref=e418]: Open Agent Harness 的不同之处在于，它不把 Harness 写成组件百科，也不把 Workflow 当成全部答案。它把能力收敛到 Runtime 可执行的协议对象：Model 声明，Runtime 治理，Action 表意，Executor 执行，Event 记录，Projection 操作，Trace 举证，Context 构造，Adapter 扩展，UI 操作。
          - figure "常见理念更偏能力拼装；这里的取舍是用 Runtime 控制面把能力落成可执行、可审计、可恢复的协议对象。" [ref=e419]:
