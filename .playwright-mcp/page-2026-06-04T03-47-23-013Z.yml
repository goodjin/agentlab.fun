          - heading "12. 结尾：大规模 Agent 协作的关键是可控" [level=2] [ref=e480]
          - paragraph [ref=e481]: 大规模 Agent 协作当然需要更强的模型、更好的工具、更长的上下文和更稳定的沙箱。但这些只能扩大能力半径，不能自动带来可控性。系统能不能持续运行，取决于它是否有稳定的治理协议。
          - paragraph [ref=e482]: 可控不是限制模型思考，而是让模型的行动进入协议。模型声明意图，Runtime 判断和执行，Event 记录事实，Projection 提供当前视图，Trace 保留证据，Context 控制输入，Workflow 扩展长任务，UI 承载人的操作。
          - paragraph [ref=e483]: 当 Agent 从一次性对话走向长期运行环境，Harness 就不再是外壳。它变成了 Agent 系统的操作环境，也变成了人、模型、工具和流程之间的治理边界。大规模 Agent 协作的关键，不是放大自主性，而是让自主性可控。
          - figure "大规模 Agent 协作的关键是可控：模型可以更主动，但每次行动都要进入可验证、可恢复、可审计的运行闭环。" [ref=e484]:
