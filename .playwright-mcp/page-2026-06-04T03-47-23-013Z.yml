        - generic [ref=e320]:
          - heading "8. Agent Session 之间不直接通信" [level=2] [ref=e321]
          - paragraph [ref=e322]: 多 Agent 的收益来自上下文隔离、并行探索、独立评估和明确交接。但多 Agent 也会带来成本、冲突和状态一致性问题。让 Agent Session 互相转发自然语言消息，看起来直接，实际会把系统带回不可审计的聊天网络。
          - paragraph [ref=e323]: 更稳的方式是：Agent Session 之间不直接通信。Agent A 可以提交结果、Artifact、风险、未决问题或下一步 Action 建议。Runtime 接受这些内容后，生成 Event、更新 Projection、创建 Handoff 或 Assignment，再把结构化 Context Bundle 交给 Agent B。
          - paragraph [ref=e324]: 这样每一次交接都有 contract、authority、evidence、budget、unresolved issues 和 trace continuity。协作不靠自由文本延续，而靠 Runtime 管理的任务边界和证据传递。
          - figure "多 Agent 协作的核心不是互相聊天，而是通过 Runtime 保留任务边界、证据和状态连续性。" [ref=e325]:
            - img "Agent Session 通过 Runtime 协作 Agent Session A 不直接把消息发给 B，而是通过 Runtime 的 Event、Artifact、Projection、Handoff 和 Assignment 完成交接。" [ref=e326]:
