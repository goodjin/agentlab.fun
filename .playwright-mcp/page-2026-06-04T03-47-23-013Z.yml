        - generic [ref=e75]:
          - heading "1. 规模化之后，如何防止模型失控" [level=2] [ref=e76]
          - paragraph [ref=e77]: 模型失控不一定表现为“模型有了自己的意志”。在工程系统里，它更常见的样子是：模型连续行动，却没有稳定状态边界；工具调用不断发生，却没人能解释哪些动作被接受；多个会话都在推进任务，却没有统一的事实来源。
          - paragraph [ref=e78]: 单个 Agent loop 里，这些问题容易被聊天记录掩盖。系统规模变大后，长任务、多会话、多工具、多 Agent、人工审批、Workflow 和 UI 操作会同时出现。此时要防止失控，不能只靠更长 prompt 或更严格的工具描述，而要回答一组运行时问题：谁能改变状态？哪些事实被系统接受？失败后从哪里恢复？后续 Session 应该读什么？UI 展示的是自然语言解释，还是系统当前状态？
          - paragraph [ref=e79]: Harness 的第一职责，就是把模型的行动冲动放进可治理边界。模型可以声明意图，可以提出下一步，可以请求工具、委派任务或生成 Workflow；但状态变更、权限校验、执行调度、事件记录和恢复路径要由 Runtime 接管。
          - figure "规模化之后，失控来自多个执行主体、状态源、操作入口和恢复路径同时存在。Harness 先要把模型行动放进治理边界。" [ref=e80]:
            - img "从单 Agent 循环到大规模 Agent 系统 左侧是单模型工具循环，右侧是多个会话、工具、状态、UI 和人工决策共同参与的运行环境。" [ref=e81]:
