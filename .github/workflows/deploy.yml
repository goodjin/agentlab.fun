name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Run check script
        run: node scripts/check-site.js

      - name: Deploy to server
        if: vars.DEPLOY_TO_SERVER == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            rsync -avz --delete \
              ${{ github.workspace }}/www/ \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }}/

      - name: Deploy to Cloudflare Pages
        if: vars.CLOUDFLARE_PAGES == 'true'
        run: |
          # Cloudflare Pages uses git integration, this step is for reference
          # The actual deployment happens via Cloudflare Pages git connection
          echo "Cloudflare Pages deployment is handled by Cloudflare's git integration"
          echo "Make sure your repository is connected in Cloudflare Dashboard"
