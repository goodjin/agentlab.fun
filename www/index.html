<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jin&#39;s AI Companion - Jin's AI Companion</title>
    <style>
        :root {
            --primary: #2563eb;
            --accent: #10b981;
            --bg: #ffffff;
            --bg-light: #f8fafc;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'SF Mono', Menlo, Monaco, 'Courier New', monospace;
            --max-width: 800px;
            --line-height: 1.8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            line-height: var(--line-height);
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            color: #333;
            text-decoration: none;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #2563eb, #10b981);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        nav {
            display: flex;
            gap: 8px;
        }

        nav a {
            padding: 8px 16px;
            border-radius: 6px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        nav a:hover, nav a.active {
            color: #333;
            background: #f0f0f0;
        }

        main {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        h1 {
            font-size: 1.75rem;
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }

        h2 {
            font-size: 1.25rem;
            color: var(--primary);
            margin-top: 2rem;
            margin-bottom: 1rem;
            border-left: 4px solid var(--primary);
            padding-left: 0.75rem;
        }

        h3 {
            font-size: 1rem;
            color: var(--text);
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }

        p { margin-bottom: 1rem; }

        a { color: var(--primary); text-decoration: none; }
        a:hover { text-decoration: underline; }

        code {
            font-family: var(--font-mono);
            font-size: 0.9em;
            background: var(--bg-light);
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
        }

        pre {
            background: var(--bg-light);
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1rem;
        }

        pre code { background: none; padding: 0; }

        blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 1rem;
            margin: 1rem 0;
            color: var(--text-muted);
        }

        ul, ol {
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }

        li { margin-bottom: 0.5rem; }

        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 2rem 0;
        }

        .meta {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--bg-light);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .tag {
            display: inline-block;
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            background: #eff6ff;
            color: var(--primary);
            border-radius: 0.25rem;
            margin-right: 0.5rem;
            margin-bottom: 0.25rem;
        }

        footer {
            background: var(--bg-light);
            border-top: 1px solid var(--border);
            padding: 2rem;
            text-align: center;
            color: var(--text-muted);
            margin-top: 4rem;
        }

        @media (max-width: 768px) {
            header { padding: 0 16px; }
            nav a { padding: 8px 12px; font-size: 13px; }
            main { padding: 1.5rem 1rem; }
        }
    </style>
</head>
