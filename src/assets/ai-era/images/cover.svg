<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#667eea" opacity="0.1"/>
  <circle cx="1100" cy="530" r="250" fill="#764ba2" opacity="0.1"/>
  <circle cx="600" cy="315" r="300" fill="none" stroke="#667eea" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Main concept: Agent loop diagram (simplified) -->
  <g transform="translate(850, 200)" filter="url(#glow)">
    <!-- Agent circle -->
    <circle cx="0" cy="0" r="80" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0891b2">Agent</text>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0e7490">程序控制</text>
    
    <!-- LLM circle -->
    <circle cx="-120" cy="-100" r="60" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="-120" y="-105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400e">LLM</text>
    <text x="-120" y="-85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#b45309">推理决策</text>
    
    <!-- Tools circle -->
    <circle cx="120" cy="-100" r="60" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="120" y="-105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#166534">Tools</text>
    <text x="120" y="-85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#15803d">工具执行</text>
    
    <!-- Connection lines -->
    <line x1="-60" y1="-40" x2="-80" y2="-70" stroke="#667eea" stroke-width="2"/>
    <line x1="60" y1="-40" x2="80" y2="-70" stroke="#667eea" stroke-width="2"/>
    <path d="M-80,-50 Q-120,-20 -60,30" stroke="#0f766e" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
    <path d="M80,-50 Q120,-20 60,30" stroke="#0f766e" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
    
    <!-- Loop arrow -->
    <path d="M-50,60 Q-120,100 0,80 Q120,60 50,60" stroke="#764ba2" stroke-width="2" fill="none"/>
    <polygon points="50,55 45,65 55,65" fill="#764ba2"/>
  </g>
  
  <!-- Left side: Key concepts -->
  <g transform="translate(80, 150)">
    <rect x="0" y="0" width="280" height="350" rx="15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <text x="140" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#667eea">核心概念</text>
    
    <!-- Concept 1 -->
    <circle cx="30" cy="80" r="12" fill="#0891b2"/>
    <text x="55" y="85" font-family="Arial, sans-serif" font-size="13" fill="white">Agent = 代理</text>
    
    <!-- Concept 2 -->
    <circle cx="30" cy="130" r="12" fill="#d97706"/>
    <text x="55" y="135" font-family="Arial, sans-serif" font-size="13" fill="white">LLM = 推理引擎</text>
    
    <!-- Concept 3 -->
    <circle cx="30" cy="180" r="12" fill="#16a34a"/>
    <text x="55" y="185" font-family="Arial, sans-serif" font-size="13" fill="white">Tools = 执行器</text>
    
    <!-- Concept 4 -->
    <circle cx="30" cy="230" r="12" fill="#764ba2"/>
    <text x="55" y="235" font-family="Arial, sans-serif" font-size="13" fill="white">DSL = 协议语言</text>
    
    <!-- Concept 5 -->
    <circle cx="30" cy="280" r="12" fill="#e74c3c"/>
    <text x="55" y="285" font-family="Arial, sans-serif" font-size="13" fill="white">Program = 确定性</text>
  </g>
  
  <!-- Title -->
  <text x="600" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white">让大模型歇一歇，让Agent上</text>
  
  <!-- Subtitle -->
  <rect x="450" y="545" width="300" height="3" rx="1.5" fill="url(#accentGrad)"/>
  
  <text x="600" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">超越 Chat Runner 的设计思考</text>
  
  <!-- Bottom tagline -->
  <text x="600" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">大模型擅长推理 · 程序擅长执行 · 各司其职</text>
</svg>
