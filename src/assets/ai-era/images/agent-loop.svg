<svg width="1180" height="640" viewBox="0 0 1180 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
      .agent { fill: #ecfeff; stroke: #0891b2; }
      .llm { fill: #fef3c7; stroke: #d97706; }
      .tool { fill: #f0fdf4; stroke: #16a34a; }
      .user { fill: #eef2ff; stroke: #4f46e5; }
      .decision { fill: #fff7ed; stroke: #ea580c; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 26px; font-weight: 700; fill: #0f172a; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; font-weight: 650; fill: #0f172a; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; fill: #475569; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 650; fill: #334155; }
      .line { stroke: #334155; stroke-width: 2.4; marker-end: url(#arrow); }
      .loop { stroke: #0f766e; stroke-width: 2.6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1180" height="640" rx="24"/>
  <text x="590" y="58" text-anchor="middle" class="title">Agent 与 LLM 的工具调用循环</text>

  <rect x="56" y="110" width="190" height="96" rx="14" class="box user"/>
  <text x="151" y="148" text-anchor="middle" class="text">用户</text>
  <text x="151" y="176" text-anchor="middle" class="sub">输入需求</text>

  <rect x="318" y="110" width="220" height="96" rx="14" class="box agent"/>
  <text x="428" y="148" text-anchor="middle" class="text">Agent</text>
  <text x="428" y="176" text-anchor="middle" class="sub">接收输入，组装请求</text>

  <rect x="620" y="110" width="230" height="96" rx="14" class="box llm"/>
  <text x="735" y="148" text-anchor="middle" class="text">大模型 LLM</text>
  <text x="735" y="176" text-anchor="middle" class="sub">利用推理能力决定输出</text>

  <path d="M246 158 H310" class="line"/>
  <text x="278" y="140" text-anchor="middle" class="label">需求</text>

  <path d="M538 158 H612" class="line"/>
  <text x="575" y="140" text-anchor="middle" class="label">请求 LLM</text>

  <polygon points="735,278 858,350 735,422 612,350" class="decision"/>
  <text x="735" y="342" text-anchor="middle" class="text">是否需要</text>
  <text x="735" y="368" text-anchor="middle" class="text">调用工具？</text>

  <path d="M735 206 V270" class="line"/>
  <text x="790" y="246" class="label">LLM 响应</text>

  <rect x="930" y="300" width="190" height="100" rx="14" class="box tool"/>
  <text x="1025" y="340" text-anchor="middle" class="text">工具</text>
  <text x="1025" y="368" text-anchor="middle" class="sub">搜索 / 代码 / API</text>

  <path d="M858 350 H922" class="line"/>
  <text x="890" y="332" text-anchor="middle" class="label">是</text>
  <text x="890" y="380" text-anchor="middle" class="sub">Agent 代为调用</text>

  <path d="M1025 400 V514 H428 V214" class="loop"/>
  <text x="742" y="500" text-anchor="middle" class="label">工具结果返回给 Agent，并写入上下文</text>
  <text x="520" y="250" class="sub">再次请求 LLM</text>

  <rect x="318" y="466" width="220" height="96" rx="14" class="box agent"/>
  <text x="428" y="504" text-anchor="middle" class="text">Agent</text>
  <text x="428" y="532" text-anchor="middle" class="sub">判断当前轮次结束</text>

  <rect x="56" y="466" width="190" height="96" rx="14" class="box user"/>
  <text x="151" y="504" text-anchor="middle" class="text">用户</text>
  <text x="151" y="532" text-anchor="middle" class="sub">查看结果，等待再输入</text>

  <path d="M612 350 H538 V514" class="line"/>
  <text x="570" y="332" text-anchor="middle" class="label">否</text>
  <text x="548" y="436" class="sub">LLM 输出最终文本</text>

  <path d="M318 514 H254" class="line"/>
  <text x="286" y="496" text-anchor="middle" class="label">展示结果</text>

  <path d="M151 466 V226" class="line"/>
  <text x="38" y="350" class="sub" transform="rotate(-90 38 350)">下一轮用户输入</text>
</svg>
